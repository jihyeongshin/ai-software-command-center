name: aiscc-p1-3-evidence

services:
  fixture:
    image: python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
    command: ["python", "/workspace/fixture_server.py"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ../../tests/fixtures/network:/workspace:ro
    networks:
      evidence:
        aliases: ["fixture"]

  probe:
    image: python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
    command: ["python", "-c", "import urllib.request; print(urllib.request.urlopen('http://fixture:8080', timeout=2).read().decode())"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on: ["fixture"]
    networks: ["evidence"]

networks:
  evidence:
    internal: true
